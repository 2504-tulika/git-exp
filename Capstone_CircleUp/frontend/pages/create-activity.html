<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CircleUp — Create Activity</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/create-activity.css" />
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="../index.html" class="navbar-logo">CircleUp</a>
    <div class="navbar-links">
      <a href="activities.html" class="navbar-link">Activities</a>
    </div>
    <div class="navbar-user">
      <div id="profile-trigger-mount">
        <div class="profile-trigger" id="profile-trigger">
          <div class="navbar-avatar" id="pd-nav-avatar" onclick="toggleDropdown()">?</div>
          <div class="profile-dropdown" id="profile-dropdown">
            <div class="pd-header">
              <div class="pd-avatar" id="pd-avatar">?</div>
              <div class="pd-identity">
                <div class="pd-name" id="pd-name">Loading...</div>
                <div class="pd-email" id="pd-email"></div>
              </div>
            </div>
            <div class="pd-fields" id="pd-fields">
              <div class="pd-field">
                <span class="pd-field-label">City</span>
                <span class="pd-field-value" id="pd-city">—</span>
              </div>
              <div class="pd-field">
                <span class="pd-field-label">Phone</span>
                <span class="pd-field-value" id="pd-phone">—</span>
              </div>
              <div class="pd-field">
                <span class="pd-field-label">Gender</span>
                <span class="pd-field-value" id="pd-gender">—</span>
              </div>
              <div class="pd-field">
                <span class="pd-field-label">Handle</span>
                <span class="pd-field-value" id="pd-social">—</span>
              </div>
              <div class="pd-field">
                <span class="pd-field-label">Bio</span>
                <span class="pd-field-value" id="pd-bio">—</span>
              </div>
            </div>
            <form class="pd-edit-form" id="pd-edit-form" novalidate>
              <div class="form-group">
                <label class="form-label">Full name</label>
                <input class="form-input" type="text" id="pd-edit-name" placeholder="Your name" />
              </div>
              <div class="form-group">
                <label class="form-label">City</label>
                <input class="form-input" type="text" id="pd-edit-city" placeholder="Your city" />
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input class="form-input" type="tel" id="pd-edit-phone"
                  placeholder="10-digit number" maxlength="10" inputmode="numeric"
                  oninput="this.value=this.value.replace(/\D/g,'')" />
              </div>
              <div class="form-group">
                <label class="form-label">Social handle</label>
                <input class="form-input" type="text" id="pd-edit-social" placeholder="@yourhandle" />
              </div>
              <div class="form-group">
                <label class="form-label">Bio</label>
                <input class="form-input" type="text" id="pd-edit-bio" placeholder="About you" />
              </div>
              <div class="pd-edit-actions">
                <button type="submit" class="btn btn-primary" id="pd-save-btn">Save</button>
                <button type="button" class="btn btn-ghost" onclick="cancelProfileEdit()">Cancel</button>
              </div>
            </form>
            <div class="pd-saving" id="pd-saving">
              <span class="spinner spinner-teal"></span> Saving...
            </div>
            <div class="pd-footer">
              <button class="pd-action" onclick="startProfileEdit()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                Edit profile
              </button>
              <button class="pd-action danger" onclick="handleLogout()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sign out
              </button>
            </div>
          </div>
        </div>
        <div class="profile-overlay" id="profile-overlay" onclick="closeDropdown()"></div>
      </div>
    </div>
  </div>
</nav>

<main class="container" style="padding-top: 40px; padding-bottom: 64px;">

  <!-- Back link -->
  <a href="activities.html" class="detail-back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Back to Activities
  </a>

  <!-- Page header -->
  <div class="page-header">
    <h1 class="page-title">Create an activity</h1>
    <p class="page-subtitle">Fill in the details and let people find you</p>
  </div>

  <!-- Form card -->
  <div class="create-card">

    <!-- Alert -->
    <div id="create-alert" class="alert alert-error" style="display:none; margin-bottom:24px;">
      <span id="create-alert-msg"></span>
    </div>

    <form id="create-form" novalidate>

      <div class="section-label">Activity details</div>

      <!-- Title -->
      <div class="form-group">
        <label class="form-label" for="ca-title">
          Title <span class="required-mark">*</span>
        </label>
        <input class="form-input" type="text" id="ca-title"
          placeholder="e.g. Sunday Cricket Match" maxlength="150" />
        <span class="form-error" id="ca-title-error" style="display:none;"></span>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label" for="ca-description">Description</label>
        <textarea class="form-input" id="ca-description" rows="3"
          placeholder="Tell people what this activity is about, what to bring, skill level etc."
          maxlength="1000"></textarea>
        <span class="form-error" id="ca-description-error" style="display:none;"></span>
      </div>

      <!-- Category + Location -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="ca-category">
            Category <span class="required-mark">*</span>
          </label>
          <select class="form-select" id="ca-category">
            <option value="" disabled selected>Select a category</option>
            <option value="sports">Sports</option>
            <option value="study">Study</option>
            <option value="food">Food</option>
            <option value="travel">Travel</option>
            <option value="social">Social</option>
            <option value="other">Other</option>
          </select>
          <span class="form-error" id="ca-category-error" style="display:none;"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="ca-location">
            Location <span class="required-mark">*</span>
          </label>
          <input class="form-input" type="text" id="ca-location"
            placeholder="e.g. Sector 4 Ground, Pune" maxlength="200" />
          <span class="form-error" id="ca-location-error" style="display:none;"></span>
        </div>
      </div>

      <div class="section-label" style="margin-top: 4px;">When</div>

      <!-- Date + Time -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="ca-date">
            Date <span class="required-mark">*</span>
          </label>
          <input class="form-input" type="date" id="ca-date" />
          <span class="form-error" id="ca-date-error" style="display:none;"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="ca-time">
            Time <span class="required-mark">*</span>
          </label>
          <input class="form-input" type="time" id="ca-time" />
          <span class="form-error" id="ca-time-error" style="display:none;"></span>
        </div>
      </div>

      <div class="section-label" style="margin-top: 4px;">Capacity</div>

      <!-- Max participants -->
      <div class="form-group" style="max-width: 280px;">
        <label class="form-label" for="ca-max">
          Maximum participants <span class="required-mark">*</span>
        </label>
        <input class="form-input" type="number" id="ca-max"
          placeholder="e.g. 10" min="1" max="500" />
        <span class="form-hint">Must be at least 1.</span>
        <span class="form-error" id="ca-max-error" style="display:none;"></span>
      </div>

      <!-- Submit -->
      <div class="create-actions">
        <button type="submit" class="btn btn-primary btn-lg" id="create-btn">
          <span id="create-btn-text">Create activity</span>
          <span id="create-spinner" class="spinner" style="display:none;"></span>
        </button>
        <a href="activities.html" class="btn btn-ghost btn-lg">Cancel</a>
      </div>

    </form>
  </div>

</main>

<div class="toast-container" id="toast-container"></div>

<script src="../js/transitions.js"></script>
<script src="../js/api.js"></script>
<script src="../js/profile-dropdown.js"></script>
<script src="../js/create-activity.js"></script>
<script>
  if (!isLoggedIn()) {
    window.location.href = 'auth.html#login';
  }
  window.addEventListener('DOMContentLoaded', () => {
    initProfileDropdown();
    initCreateActivity();
  });
</script>

</body>
</html>
