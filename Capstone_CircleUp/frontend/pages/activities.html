<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CircleUp — Activities</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="../css/activities.css" />
</head>

<body>

  <nav class="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="navbar-logo">CircleUp</a>
      <div class="navbar-links">
        <a href="activities.html" class="navbar-link active">Activities</a>
        <a href="dashboard.html" class="navbar-link">Dashboard</a>
      </div>
      <div class="navbar-user">
        <div id="profile-trigger-mount">
          <div class="profile-trigger" id="profile-trigger">
            <div class="navbar-avatar" id="pd-nav-avatar" onclick="toggleDropdown()">?</div>
            <div class="profile-dropdown" id="profile-dropdown">
              <div class="pd-header">
                <div class="pd-avatar" id="pd-avatar">?</div>
                <div class="pd-identity">
                  <div class="pd-name" id="pd-name">Loading...</div>
                  <div class="pd-email" id="pd-email"></div>
                </div>
              </div>
              <div class="pd-fields" id="pd-fields">
                <div class="pd-field">
                  <span class="pd-field-label">City</span>
                  <span class="pd-field-value" id="pd-city">—</span>
                </div>
                <div class="pd-field">
                  <span class="pd-field-label">Phone</span>
                  <span class="pd-field-value" id="pd-phone">—</span>
                </div>
                <div class="pd-field">
                  <span class="pd-field-label">Gender</span>
                  <span class="pd-field-value" id="pd-gender">—</span>
                </div>
                <div class="pd-field">
                  <span class="pd-field-label">Handle</span>
                  <span class="pd-field-value" id="pd-social">—</span>
                </div>
                <div class="pd-field">
                  <span class="pd-field-label">Bio</span>
                  <span class="pd-field-value" id="pd-bio">—</span>
                </div>
              </div>
              <form class="pd-edit-form" id="pd-edit-form" novalidate>
                <div class="form-group">
                  <label class="form-label">Full name</label>
                  <input class="form-input" type="text" id="pd-edit-name" placeholder="Your name" />
                </div>
                <div class="form-group">
                  <label class="form-label">City</label>
                  <input class="form-input" type="text" id="pd-edit-city" placeholder="Your city" />
                </div>
                <div class="form-group">
                  <label class="form-label">Phone</label>
                  <input class="form-input" type="tel" id="pd-edit-phone" placeholder="10-digit number" maxlength="10"
                    inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')" />
                </div>
                <div class="form-group">
                  <label class="form-label">Social handle</label>
                  <input class="form-input" type="text" id="pd-edit-social" placeholder="@yourhandle" />
                </div>
                <div class="form-group">
                  <label class="form-label">Bio</label>
                  <input class="form-input" type="text" id="pd-edit-bio" placeholder="About you" />
                </div>
                <div class="pd-edit-actions">
                  <button type="submit" class="btn btn-primary" id="pd-save-btn">Save</button>
                  <button type="button" class="btn btn-ghost" onclick="cancelProfileEdit()">Cancel</button>
                </div>
              </form>
              <div class="pd-saving" id="pd-saving">
                <span class="spinner spinner-teal"></span> Saving...
              </div>
              <div class="pd-footer">
                <button class="pd-action" onclick="startProfileEdit()">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                  </svg>
                  Edit profile
                </button>
                <button class="pd-action danger" onclick="handleLogout()">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                  </svg>
                  Sign out
                </button>
              </div>
            </div>
          </div>
          <div class="profile-overlay" id="profile-overlay" onclick="closeDropdown()"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 40px; padding-bottom: 64px;">

    <!-- Page header -->
    <div class="page-header"
      style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 class="page-title">Activities</h1>
        <p class="page-subtitle">Find something happening near you</p>
      </div>
      <a href="create-activity.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Create Activity
      </a>
    </div>

    <!-- Filters -->
    <div class="activities-filters">
      <div class="filter-group">
        <select class="form-select filter-select" id="filter-category">
          <option value="">All categories</option>
          <option value="sports">Sports</option>
          <option value="study">Study</option>
          <option value="food">Food</option>
          <option value="travel">Travel</option>
          <option value="social">Social</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="filter-group">
        <input class="form-input filter-input" type="text" id="filter-location" placeholder="Filter by location" />
      </div>
      <div class="filter-group">
        <input class="form-input filter-input" type="date" id="filter-date" />
      </div>
      <div class="filter-group">
        <select class="form-select filter-select" id="filter-sort">
          <option value="date_asc">Soonest first</option>
          <option value="date_desc">Latest first</option>
        </select>
      </div>
      <button class="btn btn-ghost btn-sm" id="clear-filters">Clear</button>
    </div>

    <!-- Loading skeletons -->
    <div id="activities-loading" class="activities-grid">
      <div class="activity-card skeleton-card">
        <div class="skeleton" style="height:20px;width:60%;border-radius:6px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:14px;width:40%;border-radius:6px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:80%;border-radius:6px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:50%;border-radius:6px;"></div>
      </div>
      <div class="activity-card skeleton-card">
        <div class="skeleton" style="height:20px;width:60%;border-radius:6px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:14px;width:40%;border-radius:6px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:80%;border-radius:6px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:50%;border-radius:6px;"></div>
      </div>
      <div class="activity-card skeleton-card">
        <div class="skeleton" style="height:20px;width:60%;border-radius:6px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:14px;width:40%;border-radius:6px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:80%;border-radius:6px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:14px;width:50%;border-radius:6px;"></div>
      </div>
    </div>

    <!-- Activities grid -->
    <div id="activities-grid" class="activities-grid" style="display:none;"></div>

    <!-- Empty state -->
    <div id="activities-empty" class="empty-state" style="display:none;">
      <div class="empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
      </div>
      <p class="empty-title">No activities found</p>
      <p class="empty-desc">Try adjusting your filters or check back later.</p>
      <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear filters</button>
    </div>

    <!-- Load more -->
    <div id="load-more-wrap" style="display:none; text-align:center; margin-top:32px;">
      <button class="btn btn-secondary" id="load-more-btn" onclick="loadMore()">Load more</button>
    </div>

  </main>

  <div class="toast-container" id="toast-container"></div>

  <script src="../js/transitions.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile-dropdown.js"></script>
  <script src="../js/activities.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'auth.html#login';
    }
    window.addEventListener('DOMContentLoaded', () => {
      initProfileDropdown();
      initActivities();
    });
  </script>

</body>

</html>
