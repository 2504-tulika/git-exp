<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CircleUp — Dashboard</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/profile.css" />
    <link rel="stylesheet" href="../css/activities.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="../index.html" class="navbar-logo">CircleUp</a>
            <div class="navbar-links">
                <a href="activities.html" class="navbar-link">Activities</a>
                <a href="dashboard.html" class="navbar-link active">Dashboard</a>
            </div>
            <div class="navbar-user">
                <div id="profile-trigger-mount">
                    <div class="profile-trigger" id="profile-trigger">
                        <div class="navbar-avatar" id="pd-nav-avatar" onclick="toggleDropdown()">?</div>
                        <div class="profile-dropdown" id="profile-dropdown">
                            <div class="pd-header">
                                <div class="pd-avatar" id="pd-avatar">?</div>
                                <div class="pd-identity">
                                    <div class="pd-name" id="pd-name">Loading...</div>
                                    <div class="pd-email" id="pd-email"></div>
                                </div>
                            </div>
                            <div class="pd-fields" id="pd-fields">
                                <div class="pd-field">
                                    <span class="pd-field-label">City</span>
                                    <span class="pd-field-value" id="pd-city">—</span>
                                </div>
                                <div class="pd-field">
                                    <span class="pd-field-label">Phone</span>
                                    <span class="pd-field-value" id="pd-phone">—</span>
                                </div>
                                <div class="pd-field">
                                    <span class="pd-field-label">Gender</span>
                                    <span class="pd-field-value" id="pd-gender">—</span>
                                </div>
                                <div class="pd-field">
                                    <span class="pd-field-label">Handle</span>
                                    <span class="pd-field-value" id="pd-social">—</span>
                                </div>
                                <div class="pd-field">
                                    <span class="pd-field-label">Bio</span>
                                    <span class="pd-field-value" id="pd-bio">—</span>
                                </div>
                            </div>
                            <form class="pd-edit-form" id="pd-edit-form" novalidate>
                                <div class="form-group">
                                    <label class="form-label">Full name</label>
                                    <input class="form-input" type="text" id="pd-edit-name" placeholder="Your name" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label">City</label>
                                    <input class="form-input" type="text" id="pd-edit-city" placeholder="Your city" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Phone</label>
                                    <input class="form-input" type="tel" id="pd-edit-phone"
                                        placeholder="10-digit number" maxlength="10" inputmode="numeric"
                                        oninput="this.value=this.value.replace(/\D/g,'')" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Social handle</label>
                                    <input class="form-input" type="text" id="pd-edit-social"
                                        placeholder="@yourhandle" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Bio</label>
                                    <input class="form-input" type="text" id="pd-edit-bio" placeholder="About you" />
                                </div>
                                <div class="pd-edit-actions">
                                    <button type="submit" class="btn btn-primary" id="pd-save-btn">Save</button>
                                    <button type="button" class="btn btn-ghost"
                                        onclick="cancelProfileEdit()">Cancel</button>
                                </div>
                            </form>
                            <div class="pd-saving" id="pd-saving">
                                <span class="spinner spinner-teal"></span> Saving...
                            </div>
                            <div class="pd-footer">
                                <button class="pd-action" onclick="startProfileEdit()">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                                    </svg>
                                    Edit profile
                                </button>
                                <button class="pd-action danger" onclick="handleLogout()">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                        <polyline points="16 17 21 12 16 7" />
                                        <line x1="21" y1="12" x2="9" y2="12" />
                                    </svg>
                                    Sign out
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="profile-overlay" id="profile-overlay" onclick="closeDropdown()"></div>
                </div>
            </div>
        </div>
    </nav>
    <main class="container" style="padding-top: 40px; padding-bottom: 64px;">
        <!-- Welcome header -->
        <div class="page-header"
            style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;">
            <div>
                <h1 class="page-title" id="welcome-title">Welcome back! 👋</h1>
                <p class="page-subtitle">Manage your activities and track requests</p>
            </div>
            <a href="create-activity.html" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Create Activity
            </a>
        </div>
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-created">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="16" />
                        <line x1="8" y1="12" x2="16" y2="12" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="stats-created">0</span>
                    <span class="stat-label">Created</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-joined">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="stats-joined">0</span>
                    <span class="stat-label">Joined</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-pending">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="stats-pending">0</span>
                    <span class="stat-label">Pending Approval</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-completed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="stats-completed">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </div>
        </div>
        <!-- Tabs Navigation -->
        <div class="dashboard-tabs">
            <button class="tab-btn active" id="tab-btn-created" onclick="switchTab('created')">Created
                Activities</button>
            <button class="tab-btn" id="tab-btn-joined" onclick="switchTab('joined')">Joined Activities</button>
            <button class="tab-btn" id="tab-btn-requested" onclick="switchTab('requested')">Requested to Join</button>
            <button class="tab-btn" id="tab-btn-rejected" onclick="switchTab('rejected')">Rejected Requests</button>
        </div>
        <!-- Activities Section -->
        <div id="dashboard-loading" class="activities-grid" style="margin-top: 24px;">
            <div class="activity-card skeleton-card">
                <div class="skeleton" style="height:20px;width:60%;border-radius:6px;margin-bottom:12px;"></div>
                <div class="skeleton" style="height:14px;width:40%;border-radius:6px;margin-bottom:8px;"></div>
                <div class="skeleton" style="height:14px;width:80%;border-radius:6px;margin-bottom:8px;"></div>
                <div class="skeleton" style="height:14px;width:50%;border-radius:6px;"></div>
            </div>
            <div class="activity-card skeleton-card">
                <div class="skeleton" style="height:20px;width:60%;border-radius:6px;margin-bottom:12px;"></div>
                <div class="skeleton" style="height:14px;width:40%;border-radius:6px;margin-bottom:8px;"></div>
                <div class="skeleton" style="height:14px;width:80%;border-radius:6px;margin-bottom:8px;"></div>
                <div class="skeleton" style="height:14px;width:50%;border-radius:6px;"></div>
            </div>
        </div>
        <div id="dashboard-grid" class="activities-grid" style="display:none; margin-top: 24px;"></div>
        <!-- Empty tab state -->
        <div id="dashboard-empty" class="empty-state" style="display:none; margin-top: 24px;">
            <div class="empty-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
            </div>
            <p class="empty-title" id="empty-title">No activities found</p>
            <p class="empty-desc" id="empty-desc">Activities under this category will show up here.</p>
        </div>
    </main>
    <div class="toast-container" id="toast-container"></div>
    <script src="../js/transitions.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/profile-dropdown.js"></script>
    <script src="../js/dashboard.js"></script>
    <script>
        if (!isLoggedIn()) {
            window.location.href = 'auth.html#login';
        }
        window.addEventListener('DOMContentLoaded', () => {
            initProfileDropdown();
            initDashboard();
        });
    </script>
</body>

</html>
